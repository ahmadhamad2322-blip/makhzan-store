<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماركت نت</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 80px; }
        
        header { background: #0f172a; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .logo { font-size: 20px; font-weight: 900; color: #38bdf8; }
        .cart-icon-btn { background: #0284c7; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .cart-count { background: #ef4444; color: white; border-radius: 50%; padding: 2px 8px; font-size: 12px; }

        .categories { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; background: #fff; border-bottom: 1px solid #e2e8f0; }
        .cat-btn { padding: 8px 16px; background: #f1f5f9; border: none; border-radius: 20px; font-size: 14px; font-weight: 600; color: #475569; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: #0284c7; color: white; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .banner { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 25px; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
        .product-img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #f1f5f9; }
        .product-title { font-weight: 700; font-size: 15px; margin-bottom: 5px; color: #0f172a; }
        .product-price { color: #16a34a; font-weight: 900; font-size: 16px; margin-bottom: 10px; }
        .add-btn { background: #0284c7; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; }

        /* نافذة السلة والشراء */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 500px; padding: 20px; border-radius: 16px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
        .send-btn { background: #25D366; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #f1f5f9; }

        /* صندوق معلومات طريقة الدفع */
        .payment-info { background: #f0fdf4; border: 1px dashed #16a34a; padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 13px; color: #166534; display: none; }

        /* زر الواتساب العائم */
        .whatsapp-float { position: fixed; bottom: 20px; left: 20px; background-color: #25d366; color: white; width: 60px; height: 60px; border-radius: 50px; text-align: center; font-size: 30px; box-shadow: 2px 2px 10px rgba(0,0,0,0.2); z-index: 1000; display: flex; justify-content: center; align-items: center; text-decoration: none; }
        .whatsapp-float:hover { background-color: #128c7e; }
        
        .summary-row { display: flex; justify-content: space-between; margin-top: 5px; font-size: 14px; }
        
        .promo-box { display: flex; gap: 8px; margin-bottom: 12px; }
        .promo-btn { background: #0284c7; color: white; border: none; padding: 0 15px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    </style>
</head>
<body>

<header>
    <div class="logo">🛒 ماركت نت</div>
    <button class="cart-icon-btn" onclick="openCart()">
        السلة 🛍️
        <span class="cart-count" id="cartCount">0</span>
    </button>
</header>

<div class="categories">
    <button class="cat-btn active" onclick="filterCategory('offers')">🔥 العروض اليومية</button>
    <button class="cat-btn" onclick="filterCategory('all')">🏠 الكل</button>
    <button class="cat-btn" onclick="filterCategory('poultry')">🍗 طيور</button>
    <button class="cat-btn" onclick="filterCategory('frozen')">🧊 مجمدات</button>
    <button class="cat-btn" onclick="filterCategory('cleaning')">✨ منظفات</button>
    <button class="cat-btn" onclick="filterCategory('spices')">🧂 عطارة</button>
    <button class="cat-btn" onclick="filterCategory('beauty')">💄 مستحضرات تجميل</button>
    <button class="cat-btn" onclick="filterCategory('accessories')">💍 اكسسوارات بنات</button>
</div>

<div class="container">
    <div class="banner">
        <h2>أهلاً بك في ماركت نت! 🎁</h2>
        <p>كل اللي تحتاجه ست البيت موجود بأقوي العروض</p>
    </div>

    <h3 style="margin-bottom: 15px;">المنتجات المتاحة</h3>
    <div class="products-grid" id="productsContainer">
        <p style="grid-column: 1/-1; text-align: center;">جاري تحميل المنتجات...</p>
    </div>
</div>

<!-- زر الواتساب العائم -->
<a href="https://wa.me/201127491224" class="whatsapp-float" target="_blank" title="تواصل معنا عبر الواتساب">
    💬
</a>

<!-- نافذة السلة وإكمال الطلب -->
<div class="modal" id="cartModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>سلة الشراء 🛒</h3>
            <button class="close-btn" onclick="closeCart()">✕</button>
        </div>
        
        <div id="cartItemsList"></div>
        <hr style="margin: 15px 0;">
        
        <div class="form-group">
            <label>كود الخصم (أدخل رقم هاتفك للحصول على خصم 5%):</label>
            <div class="promo-box">
                <input type="tel" id="promoCodeInput" placeholder="أدخل رقم الهاتف">
                <button type="button" class="promo-btn" onclick="applyPromoCode()">تطبيق الخصم</button>
            </div>
            <small id="promoMsg" style="display:none; font-weight:bold;"></small>
        </div>

        <div class="form-group">
            <label>إكرامية عامل التوصيل (اختياري):</label>
            <select id="tipAmount" onchange="updateCartUI()">
                <option value="0">بدون إكرامية 🚴</option>
                <option value="5">5 جنيه 💙</option>
                <option value="10">10 جنيه 💛</option>
                <option value="20">20 جنيه ❤️</option>
            </select>
        </div>

        <hr style="margin: 10px 0;">

        <div class="summary-row">
            <span>إجمالي المنتجات:</span>
            <span id="subTotal">0 جنيه</span>
        </div>
        <div class="summary-row" id="discountRow" style="color: #ef4444; display: none;">
            <span>خصم (5%):</span>
            <span id="discountTotal">-0 جنيه</span>
        </div>
        <div class="summary-row" style="color: #0284c7;">
            <span>خدمة التوصيل:</span>
            <span>20 جنيه</span>
        </div>
        <div class="summary-row" id="tipRow" style="color: #16a34a; display: none;">
            <span>إكرامية الديلفري:</span>
            <span id="tipTotal">0 جنيه</span>
        </div>
        <hr style="margin: 10px 0;">
        <h4 style="display: flex; justify-content: space-between; color: #16a34a;">
            <span>الإجمالي النهائي:</span>
            <span id="cartTotal">0 جنيه</span>
        </h4>

        <form id="checkoutForm" style="margin-top: 15px;" onsubmit="sendOrderToWhatsApp(event)">
            <h4>بيانات التوصيل والدفع 📝</h4>
            <div class="form-group">
                <label>الاسم الكامل:</label>
                <input type="text" id="custName" required placeholder="أدخل اسمك">
            </div>
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="tel" id="custPhone" required placeholder="01xxxxxxxx">
            </div>
            <div class="form-group">
                <label>العنوان التفصيلي:</label>
                <input type="text" id="custAddress" required placeholder="المنطقة، الشارع، رقم الشقة">
            </div>
            <div class="form-group">
                <label>طريقة الدفع:</label>
                <select id="payMethod" required onchange="togglePaymentInfo()">
                    <option value="كاش عند الاستلام">💵 كاش عند الاستلام</option>
                    <option value="فودافون كاش">📱 فودافون كاش</option>
                    <option value="إنستاباي InstaPay">💳 إنستاباي (InstaPay)</option>
                </select>

                <div id="paymentNotice" class="payment-info"></div>
            </div>
            <button type="submit" class="send-btn">إرسال الطلب عبر الواتساب 💬</button>
        </form>
    </div>
</div>

<script>
  const ADMIN_WHATSAPP_NUMBER = "201127491224";
  const DELIVERY_FEE = 20; // مصاريف التوصيل الثابتة
  let isDiscountApplied = false;

  const firebaseConfig = {
    apiKey: "AIzaSyDjWBs5Qw-1bHq3fVd8bac0b1470523c4", 
    authDomain: "makhzan-9eb1f.firebaseapp.com",
    projectId: "makhzan-9eb1f",
    storageBucket: "makhzan-9eb1f.appspot.com",
    messagingSenderId: "695067759501",
    appId: "1:695067759501:web:df932ff7bac0b1470523c4"
  };

  if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  let allProducts = [];
  let cart = [];

  db.collection('products').onSnapshot((snapshot) => {
      allProducts = [];
      snapshot.forEach((doc) => {
          allProducts.push({ id: doc.id, ...doc.data() });
      });
      renderProducts(allProducts);
  });

  function renderProducts(products) {
      const container = document.getElementById('productsContainer');
      if (products.length === 0) {
          container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748b;">لا توجد منتجات مضافة بعد.</p>';
          return;
      }
      let html = '';
      products.forEach((p) => {
          const imgSrc = p.img || 'https://via.placeholder.com/150?text=لا+توجد+صورة';
          html += `
              <div class="product-card">
                  <img src="${imgSrc}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150?text=خطأ+بالصورة'">
                  <div>
                      <div class="product-title">${p.name}</div>
                      <div class="product-price">${p.price} جنيه</div>
                  </div>
                  <button class="add-btn" onclick="addToCart('${p.id}')">إضافة للسلة 🛒</button>
              </div>
          `;
      });
      container.innerHTML = html;
  }

  function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (cat === 'all') {
          renderProducts(allProducts);
      } else {
          const filtered = allProducts.filter(p => p.cat === cat);
          renderProducts(filtered);
      }
  }

  function addToCart(id) {
      const prod = allProducts.find(p => p.id === id);
      const exist = cart.find(item => item.id === id);
      if (exist) {
          exist.qty += 1;
      } else {
          cart.push({ ...prod, qty: 1 });
      }
      updateCartUI();
      alert(`تم إضافة "${prod.name}" للسلة بنجاح!`);
  }

  function applyPromoCode() {
      const codeInput = document.getElementById('promoCodeInput').value.trim();
      const msg = document.getElementById('promoMsg');
      
      if (codeInput.length >= 10) {
          isDiscountApplied = true;
          msg.style.display = 'block';
          msg.style.color = '#16a34a';
          msg.innerText = '🎉 تم تطبيق خصم 5% بنجاح!';
          // نقل الرقم إلى خانة الهاتف للسهولة
          document.getElementById('custPhone').value = codeInput;
      } else {
          isDiscountApplied = false;
          msg.style.display = 'block';
          msg.style.color = '#ef4444';
          msg.innerText = '⚠️ يرجى إدخال رقم هاتف صحيح للحصول على الخصم.';
      }
      updateCartUI();
  }

  function updateCartUI() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartCount').innerText = count;

      const itemsList = document.getElementById('cartItemsList');
      let subtotal = 0;
      
      if (cart.length === 0) {
          itemsList.innerHTML = '<p style="text-align:center;">السلة فارغة</p>';
          document.getElementById('subTotal').innerText = '0 جنيه';
          document.getElementById('cartTotal').innerText = '0 جنيه';
          document.getElementById('discountRow').style.display = 'none';
          document.getElementById('tipRow').style.display = 'none';
      } else {
          let html = '';
          cart.forEach((item) => {
              const itemTotal = item.price * item.qty;
              subtotal += itemTotal;
              html += `
                  <div class="cart-item">
                      <div>
                          <strong>${item.name}</strong><br>
                          <small>${item.price} × ${item.qty} = ${itemTotal} جنيه</small>
                      </div>
                      <div>
                          <button onclick="changeQty('${item.id}', -1)">-</button>
                          <span style="margin: 0 5px;">${item.qty}</span>
                          <button onclick="changeQty('${item.id}', 1)">+</button>
                      </div>
                  </div>
              `;
          });
          itemsList.innerHTML = html;

          const tipFee = parseFloat(document.getElementById('tipAmount').value) || 0;
          let discountAmount = 0;

          if (isDiscountApplied) {
              discountAmount = Math.round(subtotal * 0.05);
              document.getElementById('discountRow').style.display = 'flex';
              document.getElementById('discountTotal').innerText = `-${discountAmount} جنيه`;
          } else {
              document.getElementById('discountRow').style.display = 'none';
          }

          if (tipFee > 0) {
              document.getElementById('tipRow').style.display = 'flex';
              document.getElementById('tipTotal').innerText = `${tipFee} جنيه`;
          } else {
              document.getElementById('tipRow').style.display = 'none';
          }

          const finalTotal = subtotal - discountAmount + DELIVERY_FEE + tipFee;

          document.getElementById('subTotal').innerText = subtotal + ' جنيه';
          document.getElementById('cartTotal').innerText = finalTotal + ' جنيه';
      }
  }

  function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (item) {
          item.qty += delta;
          if (item.qty <= 0) {
              cart = cart.filter(i => i.id !== id);
          }
      }
      updateCartUI();
  }

  function openCart() { document.getElementById('cartModal').style.display = 'flex'; }
  function closeCart() { document.getElementById('cartModal').style.display = 'none'; }

  function togglePaymentInfo() {
      const method = document.getElementById('payMethod').value;
      const notice = document.getElementById('paymentNotice');
      if (method === 'فودافون كاش') {
          notice.style.display = 'block';
          notice.innerHTML = '📲 يرجى تحويل المبلغ على رقم فودافون كاش: <strong>01012517345</strong> وإرفاق صورة التحويل في الواتساب.';
      } else if (method === 'إنستاباي InstaPay') {
          notice.style.display = 'block';
          notice.innerHTML = '💳 يرجى تحويل المبلغ عبر تطبيق إنستاباي على الرقم: <strong>01127491224</strong> وإرفاق إيصال التحويل.';
      } else {
          notice.style.display = 'none';
      }
  }

  function sendOrderToWhatsApp(e) {
      e.preventDefault();
      if (cart.length === 0) {
          alert("السلة فارغة! قم بإضافة منتجات أولاً.");
          return;
      }

      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const address = document.getElementById('custAddress').value;
      const payment = document.getElementById('payMethod').value;
      const tipFee = parseFloat(document.getElementById('tipAmount').value) || 0;

      let subtotal = 0;
      let itemsText = "";
      cart.forEach((item, index) => {
          const itemTotal = item.price * item.qty;
          subtotal += itemTotal;
          itemsText += `${index + 1}. ${item.name} (العدد: ${item.qty}) - ${itemTotal} جنيه\n`;
      });

      let discountAmount = isDiscountApplied ? Math.round(subtotal * 0.05) : 0;
      const finalTotal = subtotal - discountAmount + DELIVERY_FEE + tipFee;

      db.collection('orders').add({
          name: name,
          phone: phone,
          address: address,
          payment: payment,
          items: cart,
          subtotal: subtotal,
          discount: discountAmount,
          deliveryFee: DELIVERY_FEE,
          tipFee: tipFee,
          total: finalTotal,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      let message = `طلب جديد من متجر ماركت نت 🛒:\n\n` +
                      `👤 *الاسم:* ${name}\n` +
                      `📞 *الهاتف:* ${phone}\n` +
                      `📍 *العنوان:* ${address}\n` +
                      `💳 *طريقة الدفع:* ${payment}\n\n` +
                      `📦 *المنتجات:*\n${itemsText}\n` +
                      `💵 *إجمالي المنتجات:* ${subtotal} جنيه\n`;

      if (discountAmount > 0) {
          message += `🎁 *الخصم (5%):* -${discountAmount} جنيه\n`;
      }

      message += `🛵 *مصاريف التوصيل:* ${DELIVERY_FEE} جنيه\n`;

      if (tipFee > 0) {
          message += `🚴 *إكرامية الديلفري:* ${tipFee} جنيه\n`;
      }

      message += `💰 *الإجمالي النهائي:* ${finalTotal} جنيه`;

      const whatsappUrl = `https://wa.me/${ADMIN_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(whatsappUrl, '_blank');
      
      cart = [];
      isDiscountApplied = false;
      document.getElementById('promoCodeInput').value = '';
      document.getElementById('promoMsg').style.display = 'none';
      document.getElementById('tipAmount').value = '0';
      updateCartUI();
      closeCart();
  }
</script>

</body>
</html>
