<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماركت نت</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; padding-bottom: 60px; }
    
    header { background: #0084c7; color: white; padding: 15px 20px; text-align: center; font-size: 20px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    
    .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    
    .section-title { font-size: 18px; margin-bottom: 15px; color: #333; border-right: 4px solid #0084c7; padding-right: 10px; }
    
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-bottom: 30px; }
    
    .product-card { background: white; border-radius: 12px; padding: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .product-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    .product-title { font-size: 15px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
    .product-price { font-size: 14px; color: #27ae60; font-weight: bold; margin-bottom: 10px; }
    
    .btn-add { background: #0084c7; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    .btn-add:hover { background: #00699e; }
    
    .checkout-section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-top: 20px; }
    .payment-options { display: flex; gap: 10px; margin: 15px 0; }
    .payment-btn { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; cursor: pointer; text-align: center; font-weight: bold; }
    .payment-btn.active { border-color: #0084c7; background: #e0f2fe; color: #0084c7; }
    
    .payment-details { background: #f8fafc; padding: 12px; border-radius: 8px; font-size: 14px; color: #334155; margin-bottom: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <header>🛒 ماركت نت</header>

  <div class="container">
    <div class="section-title">قسم البقالة</div>
    
    <!-- عرض المنتجات مباشرة دون تقسيم فرعي -->
    <div class="products-grid" id="grocery-products">
      <!-- يتم تحميل منتجات البقالة هنا -->
    </div>

    <div class="checkout-section">
      <div class="section-title">طريقة الدفع</div>
      <div class="payment-options">
        <button class="payment-btn active" onclick="selectPayment('instapay')">InstaPay</button>
        <button class="payment-btn" onclick="selectPayment('vodafone')">فودافون كاش</button>
      </div>

      <div class="payment-details" id="payment-info">
        برجاء التحويل على رقم الانستا باي: <span style="color:#0084c7;">01127491224</span>
      </div>
    </div>
  </div>

  <script>
    // قائمة منتجات البقالة المباشرة
    const groceryProducts = [
      { id: 1, name: "ارز مصري 1كجم", price: "30 ج.م", img: "https://via.placeholder.com/150" },
      { id: 2, name: "زيت عباد الشمس 1 ليتر", price: "65 ج.م", img: "https://via.placeholder.com/150" },
      { id: 3, name: "سكر أبيض 1كجم", price: "27 ج.م", img: "https://via.placeholder.com/150" },
      { id: 4, name: "مكرونة 400 جرام", price: "12 ج.م", img: "https://via.placeholder.com/150" }
    ];

    function renderProducts() {
      const container = document.getElementById('grocery-products');
      container.innerHTML = groceryProducts.map(p => `
        <div class="product-card">
          <img src="${p.img}" alt="${p.name}">
          <div class="product-title">${p.name}</div>
          <div class="product-price">${p.price}</div>
          <button class="btn-add">إضافة للسلة</button>
        </div>
      `).join('');
    }

    function selectPayment(type) {
      const btns = document.querySelectorAll('.payment-btn');
      const infoBox = document.getElementById('payment-info');

      btns.forEach(btn => btn.classList.remove('active'));

      if (type === 'instapay') {
        btns[0].classList.add('active');
        infoBox.innerHTML = 'برجاء التحويل على رقم الانستا باي: <span style="color:#0084c7;">01127491224</span>';
      } else if (type === 'vodafone') {
        btns[1].classList.add('active');
        infoBox.innerHTML = 'برجاء التحويل على رقم فودافون كاش: <span style="color:#e11d48;">01012517345</span>';
      }
    }

    renderProducts();
  </script>

</body>
</html>
