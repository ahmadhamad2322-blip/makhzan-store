<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماركت نت - تسجيل الدخول</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #0084c7;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .tabs {
      display: flex;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: bold;
      color: #6b7280;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      color: #0084c7;
      border-bottom: 2px solid #0084c7;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: right;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #374151;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      border-color: #0084c7;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0084c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #00699e;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">🛒 ماركت نت</div>
    <div class="subtitle" id="form-subtitle">تسجيل دخول الإدارة والمسؤولين</div>

    <!-- أزرار التنقل بين التسجيل وإنشاء الحساب -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
      <button class="tab-btn" onclick="switchTab('register')">تسجيل لأول مرة</button>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="tel" class="input-field" placeholder="أدخل رقم الهاتف" required>
      </div>
      <div class="form-group">
        <label>كلمة السر</label>
        <input type="password" class="input-field" placeholder="أدخل كلمة السر" required>
      </div>
      <button type="submit" class="btn-submit">🔑 تسجيل الدخول</button>
    </form>

    <!-- نموذج إنشاء حساب جديد (يظهر فقط عند الضغط على تسجيل لأول مرة) -->
    <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="tel" class="input-field" placeholder="أدخل رقم الهاتف الخاص بك" required>
      </div>
      <div class="form-group">
        <label>إنشاء كلمة السر</label>
        <input type="password" class="input-field" placeholder="أدخل كلمة سر جديدة" required>
      </div>
      <div class="form-group">
        <label>تأكيد كلمة السر</label>
        <input type="password" class="input-field" placeholder="أعد كتابة كلمة السر" required>
      </div>
      <button type="submit" class="btn-submit">✨ إنشاء حساب جديد</button>
    </form>
  </div>

  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const subtitle = document.getElementById('form-subtitle');
      const tabs = document.querySelectorAll('.tab-btn');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
        subtitle.textContent = "تسجيل دخول الإدارة والمسؤولين";
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
        subtitle.textContent = "إنشاء حساب جديد للمستخدم";
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      alert("تم تسجيل الدخول بنجاح!");
    }

    function handleRegister(e) {
      e.preventDefault();
      alert("تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.");
      switchTab('login');
    }
  </script>

</body>
</html>
