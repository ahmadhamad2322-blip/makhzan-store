<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماركت نت | Market Net</title>
  <style>
    :root {
      --primary: #27ae60;
      --primary-dark: #219150;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --accent: #e67e22;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); direction: rtl; }

    header {
      background: var(--primary);
      color: white;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .search-box {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      display: block;
      padding: 12px 20px;
      border: 2px solid #ddd;
      border-radius: 25px;
      outline: none;
      font-size: 16px;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 15px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .card:hover { transform: translateY(-5px); }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
    }

    .card h3 { font-size: 18px; margin: 10px 0 5px; }
    .card .price { color: var(--primary); font-weight: bold; font-size: 16px; }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      width: 100%;
    }

    .btn:hover { background: var(--primary-dark); }

    .empty-msg {
      text-align: center;
      grid-column: 1 / -1;
      padding: 50px 20px;
      color: #7f8c8d;
      font-size: 18px;
    }

    /* Modal / Drawer Cart */
    .cart-drawer {
      position: fixed;
      top: 0; left: -100%;
      width: 100%; max-width: 400px; height: 100%;
      background: white;
      box-shadow: 2px 0 10px rgba(0,0,0,0.2);
      transition: 0.3s;
      z-index: 1001;
      padding: 20px;
      overflow-y: auto;
    }

    .cart-drawer.open { left: 0; }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🛒 ماركت نت</h1>
    <button class="btn" style="width:auto; margin:0;" onclick="toggleCart()">السلة (<span id="cart-count">0</span>)</button>
  </header>

  <div class="container">
    <input type="text" class="search-box" id="search" placeholder="ابحث عن منتج..." oninput="filterProducts()">
    <div class="grid" id="products-grid"></div>
  </div>

  <!-- Cart Drawer -->
  <div class="cart-drawer" id="cart-drawer">
    <h2>سلة الشراء</h2>
    <hr style="margin: 10px 0;">
    <div id="cart-items"></div>
    
    <div style="margin-top: 15px;">
      <p>المجموع: <strong id="subtotal">0</strong> ج.م</p>
      
      <div class="form-group" style="margin-top: 10px;">
        <label>خيارات التوصيل:</label>
        <select id="delivery-fee" onchange="calculateTotal()">
          <option value="15">توصيل عادي (15 ج.م)</option>
          <option value="25">توصيل سريع (25 ج.م)</option>
        </select>
      </div>

      <div class="form-group">
        <label>إكرامية الطيار (اختياري):</label>
        <input type="number" id="tip" value="0" min="0" oninput="calculateTotal()">
      </div>

      <div class="form-group">
        <label>كود الخصم:</label>
        <input type="text" id="promo-code" placeholder="أدخل الكود">
      </div>

      <h3>الإجمالي الكلي: <span id="total-price" style="color:var(--primary)">0</span> ج.م</h3>
      <hr style="margin: 15px 0;">

      <h3>بيانات الطلب</h3>
      <div class="form-group">
        <input type="text" id="cust-name" placeholder="الاسم بالكامل">
      </div>
      <div class="form-group">
        <input type="text" id="cust-address" placeholder="العنوان بالتفصيل">
      </div>
      <div class="form-group">
        <label>طريقة الدفع:</label>
        <select id="payment-method">
          <option value="كاش عند الاستلام">كاش عند الاستلام</option>
          <option value="فودافون كاش">فودافون كاش</option>
          <option value="InstaPay">إنستا باي (InstaPay)</option>
        </select>
      </div>

      <button class="btn" onclick="sendToWhatsApp()">تأكيد وإرسال عبر الواتساب 📱</button>
      <button class="btn" style="background:#e74c3c;" onclick="toggleCart()">إغلاق</button>
    </div>
  </div>

  <script>
    // تم تفريغ المصفوفة من منتجات البقالة
    const products = [];

    let cart = [];
    const phoneWhatsApp = "201000000000"; // ضَع رقم الواتساب الخاص بك هنا

    function renderProducts(items = products) {
      const grid = document.getElementById('products-grid');
      
      if (items.length === 0) {
        grid.innerHTML = `<div class="empty-msg">لا توجد منتجات معروضة حالياً. يمكنك إضافتها عبر لوحة التحكم.</div>`;
        return;
      }

      grid.innerHTML = items.map(p => `
        <div class="card">
          <img src="${p.img}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p class="price">${p.price} ج.م</p>
          <button class="btn" onclick="addToCart(${p.id})">إضافة للسلة 🛒</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = cart.find(x => x.id === id);
      if(item) {
        item.qty++;
      } else {
        const product = products.find(p => p.id === id);
        cart.push({...product, qty: 1});
      }
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.reduce((a, b) => a + b.qty, 0);
      const container = document.getElementById('cart-items');
      
      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong><br>
            <small>${item.price} × ${item.qty} = ${item.price * item.qty} ج.م</small>
          </div>
          <div>
            <button onclick="changeQty(${item.id}, 1)">+</button>
            <button onclick="changeQty(${item.id}, -1)">-</button>
          </div>
        </div>
      `).join('');

      calculateTotal();
    }

    function changeQty(id, delta) {
      const item = cart.find(x => x.id === id);
      if(item) {
        item.qty += delta;
        if(item.qty <= 0) cart = cart.filter(x => x.id !== id);
      }
      updateCartUI();
    }

    function calculateTotal() {
      const subtotal = cart.reduce((a, b) => a + (b.price * b.qty), 0);
      const delivery = parseFloat(document.getElementById('delivery-fee').value) || 0;
      const tip = parseFloat(document.getElementById('tip').value) || 0;
      
      document.getElementById('subtotal').innerText = subtotal;
      document.getElementById('total-price').innerText = subtotal + delivery + tip;
    }

    function filterProducts() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(q));
      renderProducts(filtered);
    }

    function toggleCart() {
      document.getElementById('cart-drawer').classList.toggle('open');
    }

    function sendToWhatsApp() {
      const name = document.getElementById('cust-name').value;
      const address = document.getElementById('cust-address').value;
      const payment = document.getElementById('payment-method').value;
      const total = document.getElementById('total-price').innerText;

      if(!name || !address) {
        alert("برجاء إدخال الاسم والعنوان كاملاً!");
        return;
      }

      if(cart.length === 0) {
        alert("السلة فارغة!");
        return;
      }

      let text = `🛒 *طلب جديد من متجر ماركت نت*\n\n`;
      text += `👤 *الاسم:* ${name}\n📍 *العنوان:* ${address}\n💳 *طريقة الدفع:* ${payment}\n\n`;
      text += `📦 *الطلبات:*\n`;
      
      cart.forEach(item => {
        text += `- ${item.name} × ${item.qty} = ${item.price * item.qty} ج.م\n`;
      });

      text += `\n💰 *الإجمالي النهائي:* ${total} ج.م`;

      const url = `https://wa.me/${phoneWhatsApp}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    renderProducts();
  </script>
</body>
</html>
