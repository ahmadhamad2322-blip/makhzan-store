<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مخزن - عروض تستحق التخزين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{ --ink:#23201B; --paper:#FBF6EC; --forest:#1F4D3D; --amber:#F2A93B; --line:rgba(35,32,27,0.14); }
  body{margin:0; background:var(--paper); font-family:'Tajawal',sans-serif; padding-bottom:60px;}
  header{background:var(--forest); padding:20px; text-align:center; color:#fff;}
  .container{padding:15px;}
  .prod-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:15px; margin-bottom:12px; display:flex; align-items:center; gap:12px;}
  .prod-img{width:60px; height:60px; background:#f4f4f4; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:30px;}
  .prod-details h3{margin:0; font-size:16px;}
  .prod-details p{margin:5px 0 0; color:var(--forest); font-weight:bold;}
</style>
</head>
<body>

<header><h1>متجر مخزن</h1></header>

<div class="container" id="productList">
  <p style="text-align:center;">جاري تحميل العروض...</p>
</div>

<script>
function initFirebase(){
  firebase.initializeApp({
    apiKey: "AIzaSyDjWBs5Qw-1bHX_3KOVCwinGY3i50p5swQ",
    projectId: "makhzan-9eb1f"
  });
  const db = firebase.firestore();
  
  db.collection('products').where('active', '==', true).onSnapshot(snapshot => {
    const list = document.getElementById('productList');
    list.innerHTML = '';
    snapshot.forEach(doc => {
      const p = doc.data();
      list.innerHTML += `
        <div class="prod-card">
          <div class="prod-img">${p.image_url ? `<img src="${p.image_url}" width="60">` : (p.em || '🛒')}</div>
          <div class="prod-details">
            <h3>${p.name}</h3>
            <p>${p.price} ج.م ${p.unit ? `(${p.unit})` : ''}</p>
          </div>
        </div>
      `;
    });
  });
}
window.onload = initFirebase;
</script>
</body>
</html>
