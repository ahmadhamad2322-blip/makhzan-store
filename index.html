<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماركت نت | تسوق أونلاين</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0}
body{background:#f8fafc;color:#1e293b;padding-bottom:80px}
header{background:#0f172a;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-size:20px;font-weight:900;color:#38bdf8;cursor:pointer;user-select:none}
.user-code-header-badge{font-size:11px;background:rgba(56,189,248,.15);border:1px dashed #38bdf8;color:#38bdf8;padding:2px 8px;border-radius:12px;margin-top:2px;display:none}
.header-actions{display:flex;gap:10px}
.share-btn{background:#16a34a;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer;font-size:13px}
.cart-icon-btn{background:#0284c7;color:#fff;border:none;padding:8px 15px;border-radius:20px;font-weight:700;cursor:pointer;font-size:13px}
.cart-count{background:#ef4444;border-radius:50%;padding:2px 8px;font-size:12px}
.categories{display:flex;gap:10px;padding:15px 20px;overflow-x:auto;background:#fff;border-bottom:1px solid #e2e8f0}
.cat-btn{padding:8px 16px;background:#f1f5f9;border:none;border-radius:20px;font-size:14px;font-weight:600;color:#475569;cursor:pointer;white-space:nowrap;text-decoration:none}
.cat-btn.active{background:#0284c7;color:#fff}
.container{max-width:1200px;margin:20px auto;padding:0 15px}
.search-container{display:flex;justify-content:center;margin-bottom:20px}
.search-input{width:100%;max-width:600px;padding:12px 20px;border:2px solid #e2e8f0;border-radius:25px;font-size:15px;outline:none}
.banner{background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;padding:20px;border-radius:16px;text-align:center;margin-bottom:25px}
.about-section{background:#fff;padding:15px 20px;border-radius:12px;margin-bottom:25px;border:1px solid #e2e8f0;font-size:14px;color:#475569}
.category-hero-banner{width:100%;height:160px;border-radius:16px;background-size:cover;background-position:center;margin-bottom:25px;display:none;position:relative;overflow:hidden}
.category-hero-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(15,23,42,.85),rgba(15,23,42,.3));display:flex;align-items:flex-end;padding:20px;color:#fff}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}
.product-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;display:flex;flex-direction:column;justify-content:space-between;padding:12px}
.product-img,.product-video{width:100%;height:130px;object-fit:cover;border-radius:8px;margin-bottom:10px;background:#000}
.product-media-wrap{position:relative}
.video-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);color:#fff;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;z-index:2}
.video-sound-btn{position:absolute;bottom:12px;left:8px;background:rgba(0,0,0,0.6);color:white;border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;z-index:3}
.category-group-title{grid-column:1/-1;background:#0f172a;color:#fff;padding:10px 15px;border-radius:10px;margin-top:25px;font-weight:900;font-size:14px;position:sticky;top:60px;z-index:5}
.product-title{font-weight:700;font-size:15px;margin-bottom:5px}
.product-price{color:#16a34a;font-weight:900;font-size:16px;margin-bottom:10px}
.add-btn{background:#0284c7;color:#fff;border:none;padding:8px;border-radius:8px;font-weight:700;cursor:pointer;width:100%}
.skeleton-card{background:#fff;border-radius:12px;padding:12px;border:1px solid #e2e8f0}
.skeleton-img{width:100%;height:130px;background:#e2e8f0;border-radius:8px;margin-bottom:10px;animation:pulse 1.5s infinite}
.skeleton-line{height:14px;background:#e2e8f0;border-radius:4px;margin-bottom:8px;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}
.load-more-container{text-align:center;margin-top:25px;grid-column:1/-1}
.load-more-btn{background:#475569;color:#fff;border:none;padding:10px 25px;border-radius:20px;font-weight:700;cursor:pointer}
.flying-img{position:fixed;z-index:9999;object-fit:cover;border-radius:12px;pointer-events:none;transition:all .75s cubic-bezier(0.19,1,0.22,1)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:center}
.modal-content{background:#fff;width:90%;max-width:500px;padding:20px;border-radius:16px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;border-bottom:1px solid #eee;padding-bottom:10px}
.close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#64748b}
.form-group{margin-bottom:12px}
.form-group label{display:block;margin-bottom:5px;font-weight:700;font-size:14px}
.form-group input,.form-group select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:14px}
.gps-btn{background:#0284c7;color:#fff;border:none;padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-top:5px;width:100%}
.send-btn{background:#25D366;color:#fff;border:none;padding:12px;width:100%;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.cart-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f1f5f9}
.payment-info{background:#f0fdf4;border:1px dashed #16a34a;padding:10px;border-radius:8px;margin-top:8px;font-size:13px;color:#166534;display:none}
.whatsapp-float{position:fixed;bottom:20px;left:20px;background:#25d366;color:#fff;width:60px;height:60px;border-radius:50px;text-align:center;font-size:30px;z-index:1000;display:flex;justify-content:center;align-items:center;text-decoration:none}
.summary-row{display:flex;justify-content:space-between;margin-top:5px;font-size:14px}
.promo-box{display:flex;gap:8px;margin-bottom:8px}
.promo-btn{background:#0284c7;color:#fff;border:none;padding:0 15px;border-radius:8px;font-weight:700;cursor:pointer}
.reward-alert{background:#f0fdf4;border:1px solid #16a34a;color:#15803d;padding:10px;border-radius:8px;font-size:13px;font-weight:700;margin-top:8px;display:none}
.admin-upload-progress{font-size:12px;color:#0284c7;font-weight:700;display:none;margin-top:5px;background:#f0f9ff;padding:6px;border-radius:6px}
</style>
</head>
