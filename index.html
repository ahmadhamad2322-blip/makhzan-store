<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماركت نت - المتجر ولوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --accent: #38bdf8;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #16a34a;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 90px; min-height: 100vh; }

        /* شريط التنقل العلوي */
        .app-nav {
            background: #0f172a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
        }
        .nav-tabs { display: flex; gap: 10px; }
        .nav-btn {
            background: #1e293b;
            color: #94a3b8;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .nav-btn.active { background: var(--primary); color: white; }

        /* المتجر */
        header { background: #0f172a; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: 900; color: #38bdf8; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .cart-icon-btn { background: #0284c7; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .cart-count { background: #ef4444; color: white; border-radius: 50%; padding: 2px 8px; font-size: 12px; }

        .categories { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; background: #fff; border-bottom: 1px solid #e2e8f0; }
        .cat-btn { padding: 8px 16px; background: #f1f5f9; border: none; border-radius: 20px; font-size: 14px; font-weight: 600; color: #475569; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: #0284c7; color: white; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .banner { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .product-card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; box-shadow: var(--shadow); }
        .product-img { width: 100%; height: 150px; object-fit: contain; border-radius: 10px; margin-bottom: 10px; background: #f8fafc; }
        .product-title { font-weight: 800; font-size: 16px; color: #0f172a; margin-bottom: 4px; }
        .product-desc { font-size: 12px; color: #64748b; margin-bottom: 8px; height: 36px; overflow: hidden; }
        .product-price { color: #16a34a; font-weight: 900; font-size: 18px; margin-bottom: 10px; }
        .add-btn { background: #0284c7; color: white; border: none; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }

        /* 🔍 زر البحث العائم النافذة */
        .floating-search-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 58px;
            height: 58px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4);
            cursor: pointer;
            z-index: 99;
            border: none;
            transition: transform 0.2s ease;
        }
        .floating-search-btn:active { transform: scale(0.9); }

        .search-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            z-index: 1000;
        }
        .search-content {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
        }
        .search-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .search-input-field { width: 100%; padding: 14px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 16px; outline: none; }
        .search-input-field:focus { border-color: var(--primary); }

        /* 🛍️ نافذة السلة */
        .cart-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }
        .cart-content {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .cart-items-list { overflow-y: auto; margin: 15px 0; flex-grow: 1; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
        .qty-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 28px; height: 28px; background: #e2e8f0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* لوحة التحكم */
        #adminApp { padding: 25px; max-width: 1200px; margin: 0 auto; display: none; }
        .admin-card { background: white; padding: 20px; border-radius: 16px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .form-group input, .form-group select, .form-group textarea { padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 15px; }
        .btn-submit { background: var(--primary); color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

<div class="app-nav">
    <div style="color: #38bdf8; font-weight: 900; font-size: 18px;">🛒 ماركت نت</div>
    <div class="nav-tabs">
        <button class="nav-btn active" id="btnTabStore" onclick="switchTab('store')">المتجر 🛒</button>
        <button class="nav-btn" id="btnTabAdmin" onclick="switchTab('admin')">لوحة التحكم ⚙️</button>
    </div>
</div>

<!-- ==================== المتجر ==================== -->
<div id="storeApp">
    <header>
        <div class="logo">🛒 ماركت نت</div>
        <div class="header-actions">
            <button class="cart-icon-btn" onclick="toggleCart(true)">
                السلة 🛍️
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('offers')">🔥 العروض اليومية</button>
        <button class="cat-btn" onclick="filterCategory('all')">🏠 الكل</button>
        <button class="cat-btn" onclick="filterCategory('grocery')">🛒 بقالة</button>
        <button class="cat-btn" onclick="filterCategory('poultry')">🍗 طيور</button>
        <button class="cat-btn" onclick="filterCategory('frozen')">🧊 مجمدات</button>
        <button class="cat-btn" onclick="filterCategory('cleaning')">✨ منظفات</button>
    </div>

    <div class="container">
        <div class="banner">
            <h2>أهلاً بك في ماركت نت! 🎁</h2>
            <p>جميع مستلزمات المنزل بأعلى جودة وأفضل سعر</p>
        </div>

        <h3 style="margin-bottom: 15px;">المنتجات المتاحة</h3>
        <div class="products-grid" id="productsContainer">
            <p style="grid-column: 1/-1; text-align: center;">جاري التحميل...</p>
        </div>
    </div>

    <!-- 🔍 زر البحث العائم -->
    <button class="floating-search-btn" onclick="toggleSearch(true)">🔍</button>

    <!-- نافذة البحث العائمة -->
    <div class="search-modal" id="searchModal">
        <div class="search-content">
            <div class="search-header">
                <h3>🔍 البحث عن منتج</h3>
                <button onclick="toggleSearch(false)" style="border:none; background:none; font-size:20px; cursor:pointer;">❌</button>
            </div>
            <input type="text" id="floatingSearchInput" class="search-input-field" placeholder="اكتب اسم المنتج هنا..." oninput="executeSearch()">
            <div id="searchResults" style="max-height: 300px; overflow-y: auto; margin-top: 15px;"></div>
        </div>
    </div>

    <!-- 🛍️ نافذة السلة -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>🛍️ سلة التسوق</h3>
                <button onclick="toggleCart(false)" style="border:none; background:none; font-size:20px; cursor:pointer;">❌</button>
            </div>
            <div class="cart-items-list" id="cartItemsList">
                <!-- عناصر السلة -->
            </div>
            <div style="border-top: 1px solid #e2e8f0; padding-top: 10px;">
                <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:18px; margin-bottom: 10px;">
                    <span>الإجمالي:</span>
                    <span id="cartTotalPrice" style="color:var(--success);">0 جنيه</span>
                </div>
                <button class="btn-submit" style="background: #25d366;" onclick="checkoutWhatsApp()">إرسال الطلب عبر الواتساب 💬</button>
            </div>
        </div>
    </div>
</div>

<!-- ==================== لوحة التحكم ==================== -->
<div id="adminApp">
    <div class="admin-card">
        <h3>➕ إضافة منتج جديد</h3>
        <form onsubmit="saveProduct(event)">
            <input type="hidden" id="prodId">
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="prodName" required placeholder="مثال: دجاج طازج">
            </div>
            <div class="form-group">
                <label>السعر (EGP):</label>
                <input type="number" id="prodPrice" step="0.5" required placeholder="100">
            </div>
            <div class="form-group">
                <label>القسم:</label>
                <select id="prodCat">
                    <option value="offers">🔥 العروض اليومية</option>
                    <option value="grocery">🛒 بقالة</option>
                    <option value="poultry">🍗 طيور</option>
                    <option value="frozen">🧊 مجمدات</option>
                    <option value="cleaning">✨ منظفات</option>
                </select>
            </div>
            <div class="form-group">
                <label>الوصف:</label>
                <textarea id="prodDesc" rows="2" placeholder="وصف قصير للمنتج"></textarea>
            </div>
            <button type="submit" class="btn-submit">نشر المنتج 💾</button>
        </form>
    </div>
</div>

<script>
  // تهيئة Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDjWBs5Qw-1bHq3fVd8bac0b1470523c4",
    authDomain: "makhzan-9eb1f.firebaseapp.com",
    projectId: "makhzan-9eb1f",
    storageBucket: "makhzan-9eb1f.appspot.com",
    messagingSenderId: "695067759501",
    appId: "1:695067759501:web:df932ff7bac0b1470523c4"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let allProducts = [];
  let cart = [];
  let currentCategory = 'offers';

  // التنقل بين الأقسام
  function switchTab(tab) {
      document.getElementById('btnTabStore').classList.toggle('active', tab === 'store');
      document.getElementById('btnTabAdmin').classList.toggle('active', tab === 'admin');
      document.getElementById('storeApp').style.display = tab === 'store' ? 'block' : 'none';
      document.getElementById('adminApp').style.display = tab === 'admin' ? 'block' : 'none';
  }

  // مزامنة المنتجات من داتابيز
  db.collection('products').onSnapshot((snapshot) => {
      allProducts = [];
      snapshot.forEach((doc) => allProducts.push({ id: doc.id, ...doc.data() }));
      renderProducts();
  });

  function renderProducts() {
      const container = document.getElementById('productsContainer');
      let filtered = currentCategory === 'all' ? allProducts : allProducts.filter(p => p.cat === currentCategory);

      if (filtered.length === 0) {
          container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 20px;">لا توجد منتجات حالياً.</p>';
          return;
      }

      container.innerHTML = filtered.map(p => `
          <div class="product-card">
              <img src="${p.img || 'https://via.placeholder.com/150'}" class="product-img">
              <div class="product-title">${p.name}</div>
              <div class="product-desc">${p.description || ''}</div>
              <div class="product-price">${p.price} جنيه</div>
              <button class="add-btn" onclick="addToCart('${p.id}')">إضافة للسلة 🛒</button>
          </div>
      `).join('');
  }

  function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderProducts();
  }

  /* 🛒 وظائف السلة المكتملة */
  function addToCart(id) {
      const product = allProducts.find(p => p.id === id);
      if (!product) return;

      const item = cart.find(i => i.id === id);
      if (item) {
          item.qty++;
      } else {
          cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
  }

  function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== id);
      }
      updateCartUI();
  }

  function updateCartUI() {
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      document.getElementById('cartCount').innerText = totalQty;
      document.getElementById('cartTotalPrice').innerText = totalPrice + ' جنيه';

      const list = document.getElementById('cartItemsList');
      if (cart.length === 0) {
          list.innerHTML = '<p style="text-align:center; padding: 20px;">السلة فارغة حالياً.</p>';
      } else {
          list.innerHTML = cart.map(i => `
              <div class="cart-item">
                  <div>
                      <div style="font-weight:bold;">${i.name}</div>
                      <div style="font-size:12px; color:#64748b;">${i.price} × ${i.qty} = ${i.price * i.qty} ج</div>
                  </div>
                  <div class="qty-controls">
                      <button class="qty-btn" onclick="changeQty('${i.id}', -1)">-</button>
                      <span>${i.qty}</span>
                      <button class="qty-btn" onclick="changeQty('${i.id}', 1)">+</button>
                  </div>
              </div>
          `).join('');
      }
  }

  function toggleCart(show) {
      document.getElementById('cartModal').style.display = show ? 'flex' : 'none';
  }

  function checkoutWhatsApp() {
      if (cart.length === 0) return alert('السلة فارغة!');
      let msg = 'مرحباً، أريد طلب المنتجات التالية من ماركت نت:\n\n';
      cart.forEach(i => {
          msg += `• ${i.name} (الكمية: ${i.qty}) - ${i.price * i.qty} جنيه\n`;
      });
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      msg += `\n*الإجمالي:* ${total} جنيه`;

      window.open(`https://wa.me/201127491224?text=${encodeURIComponent(msg)}`, '_blank');
  }

  /* 🔍 وظائف البحث العائم */
  function toggleSearch(show) {
      document.getElementById('searchModal').style.display = show ? 'flex' : 'none';
      if (show) document.getElementById('floatingSearchInput').focus();
  }

  function executeSearch() {
      const q = document.getElementById('floatingSearchInput').value.trim().toLowerCase();
      const resContainer = document.getElementById('searchResults');
      if (!q) {
          resContainer.innerHTML = '';
          return;
      }
      const matches = allProducts.filter(p => p.name.toLowerCase().includes(q));
      resContainer.innerHTML = matches.map(p => `
          <div style="display:flex; justify-between; align-items:center; padding: 10px; border-bottom: 1px solid #e2e8f0;">
              <div>
                  <strong>${p.name}</strong> - <span style="color:var(--success);">${p.price} ج</span>
              </div>
              <button class="add-btn" style="width:auto; padding:5px 12px;" onclick="addToCart('${p.id}'); toggleSearch(false);">إضافة 🛒</button>
          </div>
      `).join('') || '<p style="padding:10px;">لا توجد نتائج.</p>';
  }

  // حفظ منتج في الإدمن
  async function saveProduct(e) {
      e.preventDefault();
      const name = document.getElementById('prodName').value;
      const price = parseFloat(document.getElementById('prodPrice').value);
      const cat = document.getElementById('prodCat').value;
      const desc = document.getElementById('prodDesc').value;

      await db.collection('products').add({ name, price, cat, description: desc, createdAt: new Date() });
      alert('تم إضافة المنتج بنجاح!');
      e.target.reset();
  }
</script>
</body>
</html>
