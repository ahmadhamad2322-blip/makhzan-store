    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Cairo", sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #f8fafc;
            color: #0f172a;
            padding-bottom: 90px;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #0f172a;
            color: white;
            padding: 13px 15px;
            position: sticky;
            top: 0;
            z-index: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,.12);
        }

        .header-container {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand-area {
            min-width: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            color: white;
            font-weight: 900;
            font-size: 21px;
        }

        .logo-icon {
            font-size: 23px;
        }

        .logo-ar {
            color: #38bdf8;
        }

        .store-message {
            margin-top: 3px;
            color: #cbd5e1;
            font-size: 10px;
            line-height: 1.6;
            max-width: 290px;
        }

        .store-message strong {
            color: #38bdf8;
        }

        .cart-icon-btn {
            flex-shrink: 0;
            background: #0284c7;
            color: white;
            border: none;
            padding: 9px 13px;
            border-radius: 22px;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cart-icon-btn:hover {
            background: #0369a1;
        }

        .cart-badge {
            min-width: 21px;
            height: 21px;
            padding: 1px 5px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background: #ef4444;
            color: white;
            font-size: 11px;
        }

        /* =========================
           STATS
        ========================= */

        .stats-bar {
            background: #1e293b;
            color: #94a3b8;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            font-size: 11px;
        }

        .stats-num {
            color: #38bdf8;
            font-weight: 900;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            max-width: 1200px;
            margin: 12px auto 5px;
            padding: 0 12px;
        }

        .hero-box {
            background: linear-gradient(
                135deg,
                #0284c7,
                #0f172a
            );

            color: white;
            border-radius: 18px;
            padding: 20px 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(2,132,199,.15);
        }

        .hero-box h1 {
            font-size: 23px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .hero-box p {
            color: #e0f2fe;
            font-size: 12px;
            line-height: 1.8;
        }

        .delivery-badge {
            display: inline-block;
            margin-top: 10px;
            background: rgba(255,255,255,.14);
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 20px;
            padding: 5px 13px;
            font-size: 11px;
            font-weight: 800;
        }

        /* =========================
           SEARCH
        ========================= */

        .floating-search {
            position: sticky;
            top: 71px;
            z-index: 400;
            padding: 10px 12px;
            background: rgba(248,250,252,.96);
            backdrop-filter: blur(7px);
        }

        .search-box {
            max-width: 650px;
            margin: auto;
            position: relative;
        }

        .search-box input {
            width: 100%;
            height: 47px;
            padding: 8px 43px 8px 15px;
            border-radius: 25px;
            border: 2px solid #38bdf8;
            outline: none;
            background: white;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
        }

        .search-box input:focus {
            border-color: #0284c7;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #0284c7;
            font-size: 18px;
        }

        /* =========================
           CATEGORIES
        ========================= */

        .categories-container {
            max-width: 1200px;
            margin: 4px auto 10px;
            padding: 0 12px;
            display: flex;
            gap: 7px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            flex-shrink: 0;
            border: 1px solid #cbd5e1;
            background: white;
            color: #475569;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            transition: .2s;
        }

        .cat-btn:hover,
        .cat-btn.active {
            background: #0284c7;
            border-color: #0284c7;
            color: white;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products-grid {
            max-width: 1200px;
            margin: 12px auto;
            padding: 0 10px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        @media (min-width: 600px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 900px) {
            .products-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 15px;
            }
        }

        .product-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 13px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-width: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,.035);
            transition: .2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(0,0,0,.08);
        }

        .product-img-wrap {
            width: 100%;
            height: 145px;
            background: white;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 7px;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-info {
            padding: 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 13px;
            font-weight: 800;
            line-height: 1.5;
            min-height: 39px;
            color: #0f172a;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            margin: 7px 0;
        }

        .product-price {
            color: #16a34a;
            font-size: 14px;
            font-weight: 900;
        }

        .product-stock {
            background: #f1f5f9;
            color: #475569;
            border-radius: 10px;
            padding: 2px 5px;
            font-size: 9px;
            white-space: nowrap;
        }

        .add-cart-btn {
            width: 100%;
            border: none;
            background: #0284c7;
            color: white;
            border-radius: 8px;
            padding: 8px;
            font-size: 11px;
            font-weight: 900;
        }

        .add-cart-btn:hover {
            background: #0369a1;
        }

        .add-cart-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.65);
            z-index: 1500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            background: white;
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 17px;
            padding: 18px;
        }

        .modal-close {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 31px;
            height: 31px;
            border: none;
            border-radius: 50%;
            background: #f1f5f9;
            color: #334155;
            font-weight: 900;
            z-index: 2;
        }

        .modal-img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            border-radius: 10px;
            background: #f8fafc;
            margin-bottom: 12px;
        }

        .modal-detail-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px dashed #e2e8f0;
            padding: 6px 0;
            color: #475569;
            font-size: 12px;
        }

        .modal-detail-item strong {
            color: #0f172a;
        }

        /* =========================
           CART
        ========================= */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.52);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -430px;
            width: 100%;
            max-width: 410px;
            height: 100%;
            background: white;
            z-index: 1200;
            display: flex;
            flex-direction: column;
            box-shadow: -7px 0 25px rgba(0,0,0,.15);
            transition: .3s ease;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            background: #0f172a;
            color: white;
            padding: 14px 17px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-header h3 {
            font-size: 16px;
        }

        .close-cart {
            border: none;
            background: transparent;
            color: white;
            font-size: 19px;
        }

        .cart-items {
            padding: 12px;
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            gap: 9px;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .cart-item img {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            object-fit: contain;
            background: #f8fafc;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-title {
            font-size: 12px;
            font-weight: 800;
            line-height: 1.4;
        }

        .cart-item-price {
            color: #16a34a;
            font-size: 11px;
            font-weight: 900;
            margin-top: 2px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }

        .qty-btn {
            width: 23px;
            height: 23px;
            border: none;
            background: #e2e8f0;
            border-radius: 5px;
            font-weight: 900;
        }

        .remove-item {
            border: none;
            background: #fee2e2;
            color: #dc2626;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-weight: 900;
        }

        .cart-footer {
            padding: 13px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            max-height: 55vh;
            overflow-y: auto;
        }

        .cart-summary-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #475569;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .cart-total {
            border-top: 1px solid #cbd5e1;
            margin-top: 9px;
            padding-top: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 900;
        }

        .checkout-form label {
            display: block;
            color: #475569;
            font-size: 11px;
            font-weight: 800;
            margin: 7px 0 3px;
        }

        .checkout-form input,
        .checkout-form textarea,
        .checkout-form select {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            padding: 8px 9px;
            font-size: 11px;
            background: white;
        }

        .checkout-form input:focus,
        .checkout-form textarea:focus,
        .checkout-form select:focus {
            border-color: #0284c7;
        }

        .delivery-fixed {
            background: #e0f2fe;
            border: 1px solid #7dd3fc;
            color: #0369a1;
            padding: 8px;
            border-radius: 7px;
            text-align: center;
            font-size: 11px;
            font-weight: 900;
            margin-top: 5px;
        }

        .pay-info-box {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
            padding: 8px;
            border-radius: 7px;
            text-align: center;
            font-size: 10px;
            margin-top: 6px;
            display: none;
        }

        .send-order-btn {
            width: 100%;
            border: none;
            background: #25D366;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 900;
        }

        .send-order-btn:hover {
            background: #1ebe5d;
        }

        .send-order-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* =========================
           WHATSAPP FLOAT
        ========================= */

        .floating-whatsapp {
            position: fixed;
            right: 17px;
            bottom: 18px;
            width: 59px;
            height: 59px;
            border-radius: 50%;
            background: #25D366;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            z-index: 2000;
            box-shadow: 0 5px 22px rgba(0,0,0,.25);
            animation: whatsappPulse 2s infinite;
        }

        .floating-whatsapp:hover {
            transform: scale(1.08);
        }

        @keyframes whatsappPulse {

            0% {
                box-shadow:
                    0 0 0 0 rgba(37,211,102,.5);
            }

            70% {
                box-shadow:
                    0 0 0 14px rgba(37,211,102,0);
            }

            100% {
                box-shadow:
                    0 0 0 0 rgba(37,211,102,0);
            }
        }

        /* =========================
           EMPTY / LOADING
        ========================= */

        .message-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 45px 15px;
            color: #64748b;
            font-size: 13px;
        }

        .loading {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .spinner
