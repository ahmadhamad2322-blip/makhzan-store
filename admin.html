<style>
*{box-sizing:border-box}
body{

.input{

.input:focus{

.btn{

.primary{background:#07894f;color:#fff}
.dark{background:#18231d;color:#fff}

.orange{background:#f59f00;color:#fff}

.full{width:100%;margin-top:10px}

.tabs{

.tab{

.tab.active{

.message{

.sidebar{

.brand{

.modal-box{

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
 apiKey: "AIzaSyDjWBs5Qw-1bHq3fVd8bac0b1470523c4",
 authDomain: "makhzan-9eb1f.firebaseapp.com",
 projectId: "makhzan-9eb1f",
 storageBucket: "makhzan-9eb1f.appspot.com",
 messagingSenderId: "695067759501",
 appId: "1:695067759501:web:df932ff7bac0b1470523c4"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();


/* =========================
   CONSTANTS
========================= */

const OWNER_PHONE = "01127491224";

const OWNER_EMAIL =
 "201127491224@marketnet.local";

const OWNER_PASSWORD = "1378";

const WHATSAPP =
 "201127491224";


/* =========================
   STATE
========================= */

let currentUser = null;
let currentAdmin = null;
let currentPage = "dashboard";

let productsCache = [];
let ordersCache = [];
let adminsCache = [];
let categoriesCache = [];


/* =========================
   HELPERS
========================= */

function $(id){
 return document.getElementById(id);
}

function esc(value){
 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function money(value){
 return Number(value || 0).toLocaleString("ar-EG") + " ج.م";
}

function showMessage(id,text,error=false){

 const el = $(id);

 if(!el) return;

 el.textContent = text;
 el.style.display = "block";

 el.classList.toggle("error",error);

 setTimeout(()=>{
  el.style.display = "none";
 },5000);
}

function normalizePhone(phone){

 let p = String(phone || "").trim();

 p = p.replace(/\s+/g,"");

 if(p.startsWith("+20")){
  p = "0" + p.slice(3);
 }

 if(p.startsWith("20") && p.length === 12){
  p = "0" + p.slice(2);
 }

 return p;
}

function internalEmail(phone){

 const p = normalizePhone(phone);

 return p.replace(/\D/g,"") + "@marketnet.local";
}

function isOwner(){

 return currentUser &&
 currentUser.email === OWNER_EMAIL;
}

function hasPermission(permission){

 if(isOwner()) return true;

 if(!currentAdmin) return false;

 return currentAdmin.active === true &&
 currentAdmin.permissions &&
 currentAdmin.permissions[permission] === true;
}

function categoryAllowed(category){

 if(isOwner()) return true;

 if(!currentAdmin || !currentAdmin.active){
  return false;
 }

 const permissions =
 currentAdmin.categoryPermissions || {};

 if(permissions.all === true){
  return true;
 }

 return permissions[category] === true;
}


/* =========================
   LOGIN TABS
========================= */

function showLogin(){

 $("loginBox").classList.remove("hidden");
 $("requestBox").classList.add("hidden");

 $("loginTab").classList.add("active");
 $("requestTab").classList.remove("active");

}

function showRequest(){

 $("loginBox").classList.add("hidden");
 $("requestBox").classList.remove("hidden");

 $("loginTab").classList.remove("active");
 $("requestTab").classList.add("active");

}


/* =========================
   LOGIN
========================= */

async function login(){

 const phone =
 normalizePhone($("loginPhone").value);

 const password =
 $("loginPassword").value;

 if(!phone || !password){

  showMessage(
   "loginMessage",
   "اكتب رقم الموبايل وكلمة المرور",
   true
  );

  return;
 }

 let email = internalEmail(phone);

 try{

  /*
   المالك:
   01127491224
   يتحول إلى:
   201127491224@marketnet.local
  */

  await auth.signInWithEmailAndPassword(
   email,
   password
  );

 }catch(error){

  console.error(error);

  showMessage(
   "loginMessage",
   "بيانات الدخول غير صحيحة أو الحساب غير موجود.",
   true
  );

 }

}


/* =========================
   AUTH STATE
========================= */

auth.onAuthStateChanged(async user=>{

 currentUser = user;

 if(!user){

  $("loginWrap").style.display = "flex";
  $("app").style.display = "none";

  return;
 }

 try{

  if(user.email === OWNER_EMAIL){

   currentAdmin = {
    uid:user.uid,
    phone:OWNER_PHONE,
    name:"مالك المتجر",
    role:"owner",
    active:true,
    permissions:{
     products:true,
     orders:true,
     categories:true,
     admins:true,
     ads:true,
     settings:true,
     seo:true,
     stats:true
    }
   };

  }else{

   const snap =
    await db.collection("admins")
    .doc(user.uid)
    .get();

   if(!snap.exists){

    await auth.signOut();

    showMessage(
     "loginMessage",
     "الحساب غير معتمد من مالك المتجر.",
     true
    );

    return;
   }

   currentAdmin = {
    uid:user.uid,
    ...snap.data()
   };

   if(currentAdmin.active !== true){

    await auth.signOut();

    showMessage(
     "loginMessage",
     "هذا الحساب غير مفعل حاليًا.",
     true
    );

    return;
   }

  }

  $("loginWrap").style.display = "none";
  $("app").style.display = "block";

  $("who").textContent =
   currentAdmin.name ||
   currentAdmin.phone ||
   user.email;

  go("dashboard");

 }catch(error){

  console.error(error);

  await auth.signOut();

 }

});


/* =========================
   REQUEST ADMIN
========================= */

async function requestAdmin(){

 const phone =
  normalizePhone($("requestPhone").value);

 const password =
  $("requestPassword").value;

 if(!/^01\d{9}$/.test(phone)){

  showMessage(
   "loginMessage",
   "اكتب رقم موبايل مصري صحيح.",
   true
  );

  return;
 }

 if(password.length < 6){

  showMessage(
   "loginMessage",
   "كلمة المرور يجب أن تكون 6 أحرف أو أرقام على الأقل.",
   true
  );

  return;
 }

 try{

  /*
   نستخدم تطبيق Firebase ثانوي
   حتى لا يتم تسجيل خروج المالك.
  */

  let secondary;

  try{

   secondary =
    firebase.app("staffCreator");

  }catch(e){

   secondary =
    firebase.initializeApp(
     firebaseConfig,
     "staffCreator"
    );

  }

  const secondaryAuth =
   secondary.auth();

  const credential =
   await secondaryAuth
   .createUserWithEmailAndPassword(
    internalEmail(phone),
    password
   );

  const uid = credential.user.uid;

  await db.collection("adminRequests")
   .doc(uid)
   .set({

    uid:uid,
    phone:phone,
    email:internalEmail(phone),
    createdAt:
     firebase.firestore.FieldValue.serverTimestamp(),
    status:"pending"

   });

  await secondaryAuth.signOut();

  showMessage(
   "loginMessage",
   "تم إرسال طلب الأدمن للمالك. انتظر الموافقة."
  );

  $("requestPhone").value = "";
  $("requestPassword").value = "";

 }catch(error){

  console.error(error);

  let msg =
   "حدث خطأ أثناء إنشاء طلب الأدمن.";

  if(error.code ===
   "auth/email-already-in-use"){

   msg =
    "هذا الرقم لديه حساب بالفعل.";

  }

  showMessage(
   "loginMessage",
   msg,
   true
  );

 }

}
