<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - ماركت نت</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h2, h3 { margin-bottom: 15px; color: #0284c7; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        
        .upload-box { border: 2px dashed #0284c7; padding: 15px; border-radius: 8px; text-align: center; background: #f0f9ff; cursor: pointer; margin-top: 5px; }
        .upload-box input { display: none; }
        .preview-img { max-width: 100px; max-height: 100px; border-radius: 8px; margin-top: 10px; display: none; }

        .btn-add { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-cancel { background: #64748b; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 8px; display: none; }
        .btn-add:disabled { background: #94a3b8; cursor: not-allowed; }

        .product-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #e2e8f0; gap: 10px; }
        .product-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        
        .action-btns { display: flex; gap: 6px; }
        .btn-edit { background: #f59e0b; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 id="formTitle">➕ إضافة منتج جديد</h2>
        <form id="addProductForm" onsubmit="saveProduct(event)">
            <input type="hidden" id="editProductId" value="">

            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="pName" required placeholder="مثال: فراخ بيضاء 1 كجم">
            </div>

            <div class="form-group">
                <label>السعر (بالجنيه):</label>
                <input type="number" id="pPrice" required placeholder="120">
            </div>

            <div class="form-group">
                <label>القسم:</label>
                <select id="pCat" required>
                    <option value="offers">🔥 العروض اليومية</option>
                    <option value="poultry">🍗 طيور</option>
                    <option value="cleaning">✨ منظفات</option>
                    <option value="spices">🧂 عطارة</option>
                    <option value="beauty">💄 مستحضرات تجميل</option>
                    <option value="accessories">💍 اكسسوارات بنات</option>
                </select>
            </div>

            <div class="form-group">
                <label>صورة المنتج (من الهاتف مباشرة):</label>
                <div class="upload-box" onclick="document.getElementById('pFileInput').click()">
                    <span>📁 اضغط هنا لاختيار صورة من جهازك</span>
                    <input type="file" id="pFileInput" accept="image/*" onchange="handleFileSelect(event)">
                </div>
                <center><img id="imgPreview" class="preview-img" alt="معاينة"></center>
                <input type="hidden" id="pImgUrl">
            </div>

            <button type="submit" id="submitBtn" class="btn-add">حفظ المنتج 🚀</button>
            <button type="button" id="cancelBtn" class="btn-cancel" onclick="resetForm()">إلغاء التعديل ✕</button>
        </form>
    </div>

    <div class="card">
        <h3>📦 المنتجات الحالية</h3>
        <div id="productsList">جاري التحميل...</div>
    </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDjWBs5Qw-1bHq3fVd8bac0b1470523c4", 
    authDomain: "makhzan-9eb1f.firebaseapp.com",
    projectId: "makhzan-9eb1f",
    storageBucket: "makhzan-9eb1f.appspot.com",
    messagingSenderId: "695067759501",
    appId: "1:695067759501:web:df932ff7bac0b1470523c4"
  };

  if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  // تحويل الصورة المرفوعة من الهاتف إلى Base64 مع الضغط
  function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              const maxWidth = 500;
              const scaleSize = maxWidth / img.width;
              canvas.width = maxWidth;
              canvas.height = img.height * scaleSize;

              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

              document.getElementById('pImgUrl').value = resizedDataUrl;
              const preview = document.getElementById('imgPreview');
              preview.src = resizedDataUrl;
              preview.style.display = 'block';
          };
          img.src = event.target.result;
      };
      reader.readAsDataURL(file);
  }

  // حفظ أو تحديث المنتج
  function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('editProductId').value;
      const name = document.getElementById('pName').value;
      const price = parseFloat(document.getElementById('pPrice').value);
      const cat = document.getElementById('pCat').value;
      const img = document.getElementById('pImgUrl').value;

      if (!img) {
          alert('يرجى اختيار صورة للمنتج أولاً');
          return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = id ? "جاري التحديث..." : "جاري الحفظ...";

      const productData = {
          name: name,
          price: price,
          cat: cat,
          img: img,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (!id) {
          productData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      }

      const docRef = id ? db.collection('products').doc(id) : db.collection('products');

      const operation = id ? docRef.update(productData) : docRef.add(productData);

      operation.then(() => {
          alert(id ? 'تم تحديث المنتج بنجاح! ✏️' : 'تم إضافة المنتج بنجاح! 🎉');
          resetForm();
      }).catch(err => {
          alert('حدث خطأ: ' + err.message);
          btn.disabled = false;
          btn.innerText = id ? "تحديث المنتج ✏️" : "حفظ المنتج 🚀";
      });
  }

  // تعبئة البيانات في النموذج عند اختيار التعديل
  function editProduct(id, name, price, cat, img) {
      document.getElementById('editProductId').value = id;
      document.getElementById('pName').value = name;
      document.getElementById('pPrice').value = price;
      document.getElementById('pCat').value = cat;
      document.getElementById('pImgUrl').value = img;

      const preview = document.getElementById('imgPreview');
      preview.src = img;
      preview.style.display = 'block';

      document.getElementById('formTitle').innerText = "✏️ تعديل المنتج";
      document.getElementById('submitBtn').innerText = "تحديث المنتج ✏️";
      document.getElementById('cancelBtn').style.display = "block";

      window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // إعادة صياغة النموذج للحالة الافتراضية
  function resetForm() {
      document.getElementById('addProductForm').reset();
      document.getElementById('editProductId').value = '';
      document.getElementById('pImgUrl').value = '';
      document.getElementById('imgPreview').style.display = 'none';

      document.getElementById('formTitle').innerText = "➕ إضافة منتج جديد";
      const btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.innerText = "حفظ المنتج 🚀";
      document.getElementById('cancelBtn').style.display = "none";
  }

  // عرض قائمة المنتجات مع زر التعديل والحذف
  db.collection('products').onSnapshot(snapshot => {
      const list = document.getElementById('productsList');
      if (snapshot.empty) {
          list.innerHTML = '<p>لا توجد منتجات مضافة بعد.</p>';
          return;
      }
      let html = '';
      snapshot.forEach(doc => {
          const p = doc.data();
          const safeName = p.name.replace(/'/g, "\\'");
          const safeImg = p.img ? p.img.replace(/'/g, "\\'") : '';
          
          html += `
              <div class="product-item">
                  <div style="display:flex; align-items:center; gap:10px;">
                      <img src="${p.img}" alt="${p.name}">
                      <div>
                          <strong>${p.name}</strong><br>
                          <small>${p.price} جنيه</small>
                      </div>
                  </div>
                  <div class="action-btns">
                      <button class="btn-edit" onclick="editProduct('${doc.id}', '${safeName}', ${p.price}, '${p.cat}', '${safeImg}')">تعديل 📝</button>
                      <button class="btn-delete" onclick="deleteProduct('${doc.id}')">حذف 🗑️</button>
                  </div>
              </div>
          `;
      });
      list.innerHTML = html;
  });

  // حذف المنتج
  function deleteProduct(id) {
      if (confirm('هل أنت تأكد من حذف هذا المنتج؟')) {
          db.collection('products').doc(id).delete();
      }
  }
</script>

</body>
</html>
