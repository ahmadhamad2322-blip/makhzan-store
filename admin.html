<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم في المتجر</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #34495e;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.95rem;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #219150;
        }
        .btn-delete {
            background-color: #e74c3c;
            padding: 5px 10px;
            width: auto;
            font-size: 0.85rem;
        }
        .btn-delete:hover {
            background-color: #c0392b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: right;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
        }
        th {
            background-color: #f8f9fa;
        }
        .status-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #fff;
        }
        .status-pending { background-color: #f39c12; }
        .status-completed { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة التحكم وإدارة المتجر</h1>

    <div class="grid-layout">
        <!-- قسم إضافة منتج جديد -->
        <div class="card">
            <h2>إضافة منتج جديد</h2>
            <form id="productForm">
                <div class="form-group">
                    <label>اسم المنتج</label>
                    <input type="text" id="productName" placeholder="مثال: شاي أخضر" required>
                </div>
                <div class="form-group">
                    <label>السعر (جنيه)</label>
                    <input type="number" id="productPrice" placeholder="50" required>
                </div>
                <div class="form-group">
                    <label>القسم</label>
                    <select id="productCategory">
                        <option value="بقالة">بقالة</option>
                        <option value="منظفات">منظفات</option>
                        <option value="مشروبات">مشروبات</option>
                    </select>
                </div>
                <button type="submit">إضافة للمتجر</button>
            </form>
        </div>

        <!-- قسم قائمة المنتجات المتاحة -->
        <div class="card">
            <h2>قائمة المنتجات الحالية</h2>
            <table>
                <thead>
                    <tr>
                        <th>المنتج</th>
                        <th>السعر</th>
                        <th>القسم</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="productList">
                    <!-- يتم إدراج المنتجات هنا تلقائياً -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- قسم إدارة الطلبات الواردة -->
    <div class="card">
        <h2>أحدث طلبات الشراء</h2>
        <table>
            <thead>
                <tr>
                    <th>رقم الطلب</th>
                    <th>اسم العميل</th>
                    <th>إجمالي المبلغ</th>
                    <th>الحالة</th>
                    <th>تغيير الحالة</th>
                </tr>
            </thead>
            <tbody id="orderList">
                <!-- يتم إدراج الطلبات هنا تلقائياً -->
            </tbody>
        </table>
    </div>
</div>

    ];
