<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - مخزن المتجر</title>
    
    <!-- قفل كلمة السر -->
    <script>
      var pass = prompt("من فضلك أدخل كلمة السر لفتح لوحة التحكم:");
      if (pass !== "1234") { 
        alert("كلمة سر خاطئة!");
        window.location.href = "index.html"; 
      }
    </script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; color: #333; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1, h2 { text-align: center; color: #1a252f; margin-bottom: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { width: 100%; background-color: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .product-item, .order-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .btn-delete { background-color: #e74c3c; width: auto; padding: 6px 12px; font-size: 12px; }
        .badge { background: #e1f5fe; color: #0288d1; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<div class="container">
    <h1>لوحة تحكم المتجر 🛠️</h1>

    <div class="card">
        <h2>إضافة منتج جديد</h2>
        <form id="addProductForm">
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="prodName" placeholder="مثال: شيبسي عائلي" required>
            </div>
            <div class="form-group">
                <label>السعر (بالجنيه):</label>
                <input type="number" id="prodPrice" placeholder="مثال: 15" required>
            </div>
            <div class="form-group">
                <label>القسم (اختر قسم يطابق المتجر):</label>
                <select id="prodCategory" required>
                    <option value="grocery">بقالة عامة (grocery)</option>
                    <option value="food">حلويات وأغذية (food)</option>
                    <option value="drinks">مشروبات ومشروبات غازية (drinks)</option>
                    <option value="beauty">عناية ومنظفات (beauty)</option>
                    <option value="weekly">عروض الأسبوع (weekly)</option>
                </select>
            </div>
            <div class="form-group">
                <label>رابط صورة المنتج (URL):</label>
                <input type="url" id="prodImage" placeholder="https://..." required>
            </div>
            <button type="submit">إضافة المنتج إلى المتجر 🚀</button>
        </form>
    </div>

    <div class="card">
        <h2>المنتجات المعروضة حالياً</h2>
        <div id="productsList">جاري تحميل المنتجات...</div>
    </div>

    <div class="card">
        <h2>طلبات الشراء الواردة 📦</h2>
        <div id="ordersList">جاري تحميل الطلبات...</div>
    </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDjWBs5Qw-1bHq3fVd8bac0b1470523c4", 
    authDomain: "makhzan-9eb1f.firebaseapp.com",
    projectId: "makhzan-9eb1f",
    storageBucket: "makhzan-9eb1f.appspot.com",
    messagingSenderId: "695067759501",
    appId: "1:695067759501:web:df932ff7bac0b1470523c4"
  };

  if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  document.getElementById('addProductForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('prodName').value;
      const price = parseFloat(document.getElementById('prodPrice').value);
      const cat = document.getElementById('prodCategory').value;
      const image = document.getElementById('prodImage').value;

      // إضافة المنتج بنفس الهيكل المطلوب في index.html
      db.collection('products').add({
          id: Date.now(),
          name: name,
          price: price,
          cat: cat,
          img: image,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
          alert('تمت إضافة المنتج بنجاح وتوجيهه للقسم الصحيح!');
          document.getElementById('addProductForm').reset();
      }).catch((error) => {
          alert('حدث خطأ: ' + error.message);
      });
  });

  // عرض المنتجات
  db.collection('products').onSnapshot((snapshot) => {
      const container = document.getElementById('productsList');
      if (snapshot.empty) {
          container.innerHTML = '<p style="text-align:center;">لا توجد منتجات حالياً.</p>';
          return;
      }
      let html = '';
      snapshot.forEach((doc) => {
          const data = doc.data();
          html += `
              <div class="product-item">
                  <div>
                      <strong>${data.name}</strong> - ${data.price} جنيه 
                      <span class="badge">${data.cat || 'عام'}</span>
                  </div>
                  <button class="btn-delete" onclick="deleteProduct('${doc.id}')">حذف</button>
              </div>
          `;
      });
      container.innerHTML = html;
  });

  function deleteProduct(id) {
      if (confirm('تأكيد حذف المنتج؟')) {
          db.collection('products').doc(id).delete();
      }
  }

  // عرض طلبات العميل
  db.collection('orders').onSnapshot((snapshot) => {
      const container = document.getElementById('ordersList');
      if (snapshot.empty) {
          container.innerHTML = '<p style="text-align:center;">لا توجد طلبات حتى الآن.</p>';
          return;
      }
      let html = '';
      snapshot.forEach((doc) => {
          const data = doc.data();
          let itemsText = Array.isArray(data.items) ? data.items.join(', ') : 'غير محدد';
          html += `
              <div class="order-item" style="flex-direction: column; align-items: flex-start;">
                  <div>
                      <strong>الاسم:</strong> ${data.name || 'غير معروف'}<br>
                      <strong>الهاتف:</strong> ${data.phone || 'بدون رقم'}<br>
                      <strong>العنوان:</strong> ${data.address || 'بدون عنوان'}<br>
                      <strong>المنتجات:</strong> ${itemsText}<br>
                      <strong>الإجمالي:</strong> ${data.total || 0} جنيه
                  </div>
                  <button class="btn-delete" style="margin-top:10px;" onclick="deleteOrder('${doc.id}')">حذف الطلب</button>
              </div>
          `;
      });
      container.innerHTML = html;
  });

  function deleteOrder(id) {
      if (confirm('حذف الطلب؟')) {
          db.collection('orders').doc(id).delete();
      }
  }
</script>

</body>
</html>
