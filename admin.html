<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketNet | لوحة التحكم والأمان ⚙️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background: #f8fafc; color: #0f172a; padding-bottom: 40px; }

        /* شاشة تسجيل الدخول */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .auth-card { background: #ffffff; padding: 30px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 90%; max-width: 400px; text-align: center; }

        /* لوحة تحكم المالك الحصرية */
        #owner-dashboard { max-width: 900px; margin: 30px auto; padding: 20px; display: none; }
        .dashboard-header { background: #0f172a; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .admin-section { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .admin-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #0284c7; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }

        .input-field { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; font-size: 14px; margin-top: 4px; }
        .btn-submit { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; width: 100%; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: #0369a1; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* معاينة الصورة المرفوعة بحجمها الكامل */
        .img-preview-container { width: 100%; margin-top: 10px; border: 2px dashed #cbd5e1; border-radius: 8px; padding: 10px; text-align: center; background: #fafafa; }
        .img-preview { max-width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 6px; object-fit: contain; }

        /* واجهة قائمة طلبات المستخدمين */
        .user-item { display: flex; justify-content: space-between; align-items: center; background: #f9fafb; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #e5e7eb; }
        .btn-approve { background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-reject { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 5px; }

        /* واجهة المتجر للمستخدمين العاديين فقط */
        #user-store { display: none; }
        header { background: #0f172a; color: white; padding: 15px 20px; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .products-grid { max-width: 1200px; margin: 20px auto; padding: 0 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .product-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; padding: 10px; }
        
        /* عرض الصورة الكاملة داخل المتجر بدون قص */
        .product-img-full { width: 100%; height: auto; max-height: 250px; object-fit: contain; background: #ffffff; border-radius: 6px; margin-bottom: 10px; }
    </style>
</head>
<body>

<!-- شاشة التحقق والدخول -->
<div id="auth-screen">
    <div class="auth-card">
        <h2 style="color: #0f172a; margin-bottom: 8px;">🛒 MarketNet</h2>
        <p style="font-size: 13px; color: #6b7280; margin-bottom: 20px;">تسجيل الدخول للنظام</p>
        <form onsubmit="handleAuthLogin(event)">
            <div style="text-align: right; margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: bold;">رقم الهاتف</label>
                <input type="tel" id="auth-phone" class="input-field" placeholder="أدخل رقمك هنا" required>
            </div>
            <button type="submit" class="btn-submit">دخول</button>
        </form>
    </div>
</div>

<!-- 1. لوحة تحكم المالك الحصرية (تظهر للمالك فقط) -->
<div id="owner-dashboard">
    <div class="dashboard-header">
        <div>
            <h2>⚙️ لوحة إدارة المالك</h2>
            <p style="font-size: 12px; color: #94a3b8;">إدارة المنتجات وموافقات المستخدمين</p>
        </div>
        <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- قسم رفع منتج جديد بحجم الصورة الكامل -->
    <div class="admin-section">
        <div class="admin-title">📦 إضافة منتج جديد إلى المتجر</div>
        <form onsubmit="addNewProduct(event)">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div>
                    <label style="font-size: 12px; font-weight: bold;">اسم المنتج</label>
                    <input type="text" id="np-name" class="input-field" placeholder="مثال: شيبسي طماطم" required>
                </div>
                <div>
                    <label style="font-size: 12px; font-weight: bold;">السعر (ج.م)</label>
                    <input type="number" id="np-price" class="input-field" placeholder="00" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px;">
                <div>
                    <label style="font-size: 12px; font-weight: bold;">القسم</label>
                    <select id="np-cat" class="input-field">
                        <option value="grocery">بقالة</option>
                        <option value="offers">العروض اليومية</option>
                        <option value="poultry">طيور</option>
                        <option value="frozen">مجمدات</option>
                        <option value="cleaning">منظفات</option>
                        <option value="spices">عطارة</option>
                        <option value="beauty">مستحضرات تجميل</option>
                        <option value="accessories">اكسسوارات بنات</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 12px; font-weight: bold;">الكمية بالمخزن</label>
                    <input type="number" id="np-stock" class="input-field" value="10" required>
                </div>
            </div>

            <!-- رفع صورة من الجهاز مباشرة -->
            <div style="margin-top: 12px;">
                <label style="font-size: 12px; font-weight: bold;">📸 اختر صورة المنتج من جهازك (ستُرفع كاملة دون قص):</label>
                <input type="file" id="np-image-file" class="input-field" accept="image/*" onchange="previewImage(event)" required>
            </div>

            <!-- معاينة الصورة المرفوعة -->
            <div class="img-preview-container" id="preview-box" style="display: none;">
                <p style="font-size: 11px; color: #64748b; margin-bottom: 5px;">معاينة الصورة بالحجم الكامل:</p>
                <img id="image-preview" class="img-preview" src="" alt="معاينة الصورة">
            </div>

            <div style="margin-top: 10px;">
                <label style="font-size: 12px; font-weight: bold;">وصف المنتج</label>
                <textarea id="np-desc" class="input-field" rows="2" placeholder="وصف اختيار اختياري..."></textarea>
            </div>

            <button type="submit" class="btn-submit" style="margin-top: 15px; background: #16a34a;">➕ حفظ ونشر المنتج فوراً</button>
        </form>
    </div>

    <!-- قسم إدارة الموافقات -->
    <div class="admin-section">
        <div class="admin-title">👥 طلبات الدخول المعلقة للمستخدمين</div>
        <div id="pending-users-list">
            <p style="font-size: 13px; color: #94a3b8;">جاري تحميل الطلبات...</p>
        </div>
    </div>
</div>

<!-- 2. واجهة المتجر للمستهلكين العاديين فقط -->
<div id="user-store">
    <header>
        <div class="header-container">
            <h2>🛒 MarketNet المتجر</h2>
            <button class="btn-logout" onclick="logout()">خروج</button>
        </div>
    </header>
    <div class="products-grid" id="productsGrid">
        <p style="text-align: center; grid-column: 1/-1;">جاري تحميل المنتجات...</p>
    </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDjWBs5Qw-1bHq3fVd8bac0b1470523c4", 
    authDomain: "makhzan-9eb1f.firebaseapp.com",
    projectId: "makhzan-9eb1f",
    storageBucket: "makhzan-9eb1f.appspot.com",
    messagingSenderId: "695067759501",
    appId: "1:695067759501:web:df932ff7bac0b1470523c4"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const OWNER_PHONE = "01012517345";
  let uploadedBase64Image = "";

  window.onload = function() {
      const savedPhone = localStorage.getItem('user_phone');
      if (savedPhone) {
          checkUserAccess(savedPhone);
      }
  };

  function handleAuthLogin(e) {
      e.preventDefault();
      const phone = document.getElementById('auth-phone').value.trim();
      checkUserAccess(phone);
  }

  function checkUserAccess(phone) {
      // إذا كان المالك: فتح لوحة التحكم حصرياً وحجب المتجر
      if (phone === OWNER_PHONE) {
          localStorage.setItem('user_phone', phone);
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('owner-dashboard').style.display = 'block';
          document.getElementById('user-store').style.display = 'none';
          loadPendingUsers();
          return;
      }

      // المستهلك العادي: التحقق من الموافقة وتوجيهه للمتجر فقط
      db.collection('users').doc(phone).get().then(doc => {
          if (doc.exists && doc.data().status === 'approved') {
              localStorage.setItem('user_phone', phone);
              document.getElementById('auth-screen').style.display = 'none';
              document.getElementById('owner-dashboard').style.display = 'none';
              document.getElementById('user-store').style.display = 'block';
              loadUserProducts();
          } else if (doc.exists && doc.data().status === 'pending') {
              alert("طلبك قيد الانتظار لحين موافقة المالك.");
          } else {
              db.collection('users').doc(phone).set({
                  status: 'pending',
                  createdAt: firebase.firestore.FieldValue.serverTimestamp()
              }).then(() => {
                  alert("تم إرسال طلب الدخول إلى المالك. انتظر الموافقة.");
              });
          }
      });
  }

  /* معالجة وتحويل صورة جهازك إلى صيغة كاملة دون قص */
  function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
          uploadedBase64Image = e.target.result;
          const previewImg = document.getElementById('image-preview');
          previewImg.src = uploadedBase64Image;
          document.getElementById('preview-box').style.display = 'block';
      };
      reader.readAsDataURL(file);
  }

  /* إضافة المنتج من لوحة التحكم */
  function addNewProduct(e) {
      e.preventDefault();
      if (!uploadedBase64Image) {
          alert('يرجى اختيار صورة للمنتج من جهازك!');
          return;
      }

      const newProd = {
          name: document.getElementById('np-name').value,
          price: parseFloat(document.getElementById('np-price').value),
          cat: document.getElementById('np-cat').value,
          stock: parseInt(document.getElementById('np-stock').value),
          img: uploadedBase64Image, // الحفظ بحجمها وتفاصيلها الكاملة
          desc: document.getElementById('np-desc').value,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection('products').add(newProd).then(() => {
          alert('تم إضافة المنتج بصورته الكاملة بنجاح!');
          e.target.reset();
          document.getElementById('preview-box').style.display = 'none';
          uploadedBase64Image = "";
      }).catch(err => {
          alert('حدث خطأ أثناء رفع المنتج: ' + err.message);
      });
  }

  /* تحميل طلبات الوصول المعلقة في لوحة المالك */
  function loadPendingUsers() {
      const container = document.getElementById('pending-users-list');
      db.collection('users').where('status', '==', 'pending').onSnapshot(snapshot => {
          container.innerHTML = '';
          if (snapshot.empty) {
              container.innerHTML = '<p style="font-size: 13px; color: #9ca3af;">لا توجد طلبات معلقة حالياً.</p>';
              return;
          }
          snapshot.forEach(doc => {
              const div = document.createElement('div');
              div.className = 'user-item';
              div.innerHTML = `
                  <span>📱 ${doc.id}</span>
                  <div>
                      <button class="btn-approve" onclick="updateUserStatus('${doc.id}', 'approved')">موافقة</button>
                      <button class="btn-reject" onclick="updateUserStatus('${doc.id}', 'rejected')">رفض</button>
                  </div>
              `;
              container.appendChild(div);
          });
      });
  }

  function updateUserStatus(phone, status) {
      if (status === 'rejected') {
          db.collection('users').doc(phone).delete();
      } else {
          db.collection('users').doc(phone).update({ status: status });
      }
  }

  /* عرض المنتجات للمستخدم العادي */
  function loadUserProducts() {
      const grid = document.getElementById('productsGrid');
      db.collection('products').onSnapshot(snapshot => {
          if (snapshot.empty) {
              grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">لا توجد منتجات مضافة بعد.</p>';
              return;
          }
          let html = '';
          snapshot.forEach(doc => {
              const p = doc.data();
              html += `
                  <div class="product-card">
                      <img src="${p.img}" class="product-img-full" alt="${p.name}">
                      <h4 style="font-size: 15px;">${p.name}</h4>
                      <p style="color: #16a34a; font-weight: bold; margin-top: 4px;">${p.price} ج.م</p>
                  </div>
              `;
          });
          grid.innerHTML = html;
      });
  }

  function logout() {
      localStorage.removeItem('user_phone');
      location.reload();
  }
</script>
</body>
</html>
