<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مخزن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK Compat -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --ink: #23201B;
            --paper: #FBF6EC;
            --forest: #1F4D3D;
            --amber: #F2A93B;
            --tomato: #D94A2B;
            --card: #FFFFFF;
            --line: rgba(35,32,27,0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Tajawal', sans-serif;
            padding-bottom: 80px;
        }

        header {
            background: var(--forest);
            color: #fff;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { margin: 0; font-family: 'Cairo', sans-serif; font-size: 20px; }

        .container { padding: 16px; }

        .btn-add {
            background: var(--forest);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .prod-card {
            background: var(--card);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prod-info h3 { margin: 0 0 5px; font-family: 'Cairo', sans-serif; font-size: 16px; }
        .prod-info p { margin: 0; color: var(--forest); font-weight: bold; }
        .cat-tag { font-size: 11px; background: var(--amber); padding: 2px 6px; border-radius: 4px; }

        .btn-del {
            background: var(--tomato);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: var(--paper);
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .field input, .field select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
        }

        .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
        .modal-btns button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-save { background: var(--forest); color: #fff; }
        .btn-cancel { background: #ccc; }
    </style>
</head>
<body>

<header>
    <h1>لوحة تحكم المتجر 🛠️</h1>
</header>

<div class="container">
    <button class="btn-add" onclick="openModal()">+ إضافة صنف / خدمة جديدة</button>
    <div id="adminProductList">
        <p style="text-align: center;">جاري تحميل المنتجات...</p>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="prodModal">
    <div class="modal-content">
        <h2 style="margin-top:0; font-family:'Cairo';">إضافة صنف جديد</h2>
        
        <div class="field">
            <label>القسم *</label>
            <select id="pCat">
                <option value="birds">🐦 الطيور</option>
                <option value="frozen">❄️ المجمدات</option>
                <option value="clean">🧼 المنظفات</option>
                <option value="spices">🌿 العطارة</option>
                <option value="daily">⚡ عروض اليوم</option>
                <option value="services">🛠️ خدمات عامة (فنيين وتصليح)</option>
            </select>
        </div>

        <div class="field">
            <label>اسم المنتج / الخدمة *</label>
            <input type="text" id="pName" placeholder="مثال: فراخ بانيه / فني سباكة">
        </div>

        <div class="field">
            <label>السعر (ج.م) *</label>
            <input type="number" id="pPrice" placeholder="مثال: 150">
        </div>

        <div class="field">
            <label>السعر القديم (اختياري)</label>
            <input type="number" id="pOld" placeholder="مثال: 180">
        </div>

        <div class="field">
            <label>شارة التمييز (اختياري)</label>
            <input type="text" id="pBadge" placeholder="مثال: الأكثر مبيعاً / خصم 20%">
        </div>

        <div class="field">
            <label>رابط الصورة (اختياري)</label>
            <input type="text" id="pImg" placeholder="ضع رابط صورة من الإنترنت">
        </div>

        <div class="modal-btns">
            <button class="btn-save" onclick="saveProduct()">حفظ ونشر في المتجر</button>
            <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
        </div>
    </div>
</div>

<script>
    let db;

    function initFirebase() {
        firebase.initializeApp({
            apiKey: "AIzaSyDjWBs5Qw-1bHX_3KOVCwinGY3i50p5swQ",
            projectId: "makhzan-9eb1f"
        });
        db = firebase.firestore();

        // Real-time listener for admin list
        db.collection('products').onSnapshot(snapshot => {
            const list = document.getElementById('adminProductList');
            list.innerHTML = '';

            if (snapshot.empty) {
                list.innerHTML = '<p style="text-align:center;">لا توجد منتجات مضافة بعد.</p>';
                return;
            }

            snapshot.forEach(doc => {
                const p = doc.data();
                list.innerHTML += `
                    <div class="prod-card">
                        <div class="prod-info">
                            <h3>${p.pName} <span class="cat-tag">${getCatName(p.pCat)}</span></h3>
                            <p>${p.pPrice} ج.م</p>
                        </div>
                        <button class="btn-del" onclick="deleteProduct('${doc.id}')">حذف 🗑️</button>
                    </div>
                `;
            });
        });
    }

    function getCatName(cat) {
        const names = {
            'birds': 'الطيور',
            'frozen': 'المجمدات',
            'clean': 'المنظفات',
            'spices': 'العطارة',
            'daily': 'عروض اليوم',
            'services': 'خدمات عامة'
        };
        return names[cat] || cat;
    }

    function openModal() {
        document.getElementById('prodModal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('prodModal').classList.remove('show');
    }

    function saveProduct() {
        const cat = document.getElementById('pCat').value;
        const name = document.getElementById('pName').value.trim();
        const price = parseFloat(document.getElementById('pPrice').value);
        const oldPrice = document.getElementById('pOld').value.trim();
        const badge = document.getElementById('pBadge').value.trim();
        const img = document.getElementById('pImg').value.trim();

        if (!name || isNaN(price)) {
            alert('يرجى كتابة اسم المنتج والسعر الصحيح!');
            return;
        }

        db.collection('products').add({
            pCat: cat,
            pName: name,
            pPrice: price,
            pOld: oldPrice || null,
            pBadge: badge || null,
            img: img || null,
            active: true,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert('تمت إضافة المنتج بنجاح وسيظهر في المتجر مباشرة!');
            closeModal();
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pOld').value = '';
            document.getElementById('pBadge').value = '';
            document.getElementById('pImg').value = '';
        });
    }

    function deleteProduct(id) {
        if (confirm('هل أنت تأكد من حذف هذا المنتج من المتجر؟')) {
            db.collection('products').doc(id).delete();
        }
    }

    window.onload = initFirebase;
</script>
</body>
</html>
