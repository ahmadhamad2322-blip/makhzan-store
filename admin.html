<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماركت نت - الدخول للنظام</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #0084c7;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: right;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #374151;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0084c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .admin-panel {
      margin-top: 20px;
      border-top: 2px solid #e5e7eb;
      padding-top: 15px;
      text-align: right;
    }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f9fafb;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      border: 1px solid #e5e7eb;
    }
    .btn-approve {
      background: #25D366;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-reject {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">🛒 ماركت نت</div>
    <div class="subtitle">أدخل رقم الهاتف للدخول</div>

    <!-- نموذج الدخول برقم الهاتف فقط -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="tel" id="user-phone" class="input-field" placeholder="أدخل رقم هاتفك" required>
      </div>
      <button type="submit" class="btn-submit">دخول</button>
    </form>

    <!-- لوحة التحكم الخاصة بك (تظهر فقط عند كتابة رقمك 01012517345) -->
    <div id="admin-panel" class="admin-panel hidden">
      <h3>لوحة إدارة الموافقات (المالك)</h3>
      <p style="font-size: 12px; color: #6b7280; margin-bottom: 10px;">الطلبات المعلقة للوصول للموقع:</p>
      <div id="pending-list"></div>
    </div>
  </div>

  <script>
    const OWNER_PHONE = "01012517345";

    // جلب قائمة المستخدمين من LocalStorage أو إنشاؤها
    function getUsers() {
      return JSON.parse(localStorage.getItem('users_db')) || {};
    }

    function saveUsers(users) {
      localStorage.setItem('users_db', JSON.stringify(users));
    }

    function handleLogin(e) {
      e.preventDefault();
      const phone = document.getElementById('user-phone').value.trim();
      const adminPanel = document.getElementById('admin-panel');

      // 1. إذا كان المدخل هو رقم المالك
      if (phone === OWNER_PHONE) {
        alert("أهلاً بك يا مالك الموقع! تم فتح لوحة التحكم بالطلبات.");
        adminPanel.classList.remove('hidden');
        renderPendingUsers();
        return;
      }

      adminPanel.classList.add('hidden');
      let users = getUsers();

      // 2. إذا كان المستخدم موجود ومقبول سابقاً
      if (users[phone] && users[phone].status === 'approved') {
        alert("تم دخولك بنجاح إلى الموقع!");
        // هنا يمكنك توجيهه لصفحة المتجر الرئيسية
        // window.location.href = "home.html";
      } 
      // 3. إذا كان طلبه قيد الانتظار
      else if (users[phone] && users[phone].status === 'pending') {
        alert("طلبك قيد الانتظار، في انتظار موافقة المالك.");
      } 
      // 4. إذا كان يسجل أول مرة (إنشاء طلب جديد)
      else {
        users[phone] = { status: 'pending' };
        saveUsers(users);
        alert("تم إرسال طلبك إلى المالك، يرجى الانتظار لحين الموافقة.");
      }
    }

    // عرض قائمة المنتظرين في لوحة المالك
    function renderPendingUsers() {
      const pendingList = document.getElementById('pending-list');
      const users = getUsers();
      pendingList.innerHTML = '';

      let hasPending = false;
      for (let phone in users) {
        if (users[phone].status === 'pending') {
          hasPending = true;
          const div = document.createElement('div');
          div.className = 'user-item';
          div.innerHTML = `
            <span>📱 ${phone}</span>
            <div>
              <button class="btn-approve" onclick="updateStatus('${phone}', 'approved')">موافقة</button>
              <button class="btn-reject" onclick="updateStatus('${phone}', 'rejected')">رفض</button>
            </div>
          `;
          pendingList.appendChild(div);
        }
      }

      if (!hasPending) {
        pendingList.innerHTML = '<p style="font-size: 12px; color: #9ca3af;">لا توجد طلبات معلقة حالياً.</p>';
      }
    }

    // قبول أو رفض الطلب من قبل المالك
    function updateStatus(phone, newStatus) {
      let users = getUsers();
      if (newStatus === 'rejected') {
        delete users[phone];
      } else {
        users[phone].status = newStatus;
      }
      saveUsers(users);
      renderPendingUsers();
      alert(`تم ${newStatus === 'approved' ? 'الموافقة على' : 'رفض'} الرقم ${phone}`);
    }
  </script>

</body>
</html>
